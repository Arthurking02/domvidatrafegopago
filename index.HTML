  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #fffaf5, #f7f3ee);
      color: #24364b;
    }

    .card {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: 28px;
      padding: 46px 30px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.10);
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: .12;
    }

    .shape.one {
      width: 140px;
      height: 140px;
      background: #e91e63;
      right: -50px;
      bottom: -55px;
    }

    .shape.two {
      width: 95px;
      height: 95px;
      background: #0aa58f;
      left: -35px;
      top: -25px;
    }

    .brand {
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 74px;
      height: 30px;
      margin: 0 auto 10px;
      border-top: 5px solid #e91e63;
      border-radius: 50%;
      transform: rotate(0deg);
    }

    .brand-name {
      font-size: 40px;
      font-weight: 700;
      color: #0d5ca8;
      letter-spacing: -1px;
      line-height: 1;
    }

    .brand-sub {
      margin-top: 7px;
      font-size: 13px;
      letter-spacing: 2px;
      color: #e91e63;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      font-size: 32px;
      line-height: 1.15;
      margin-bottom: 16px;
      color: #0d5ca8;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      color: #52616f;
      margin-bottom: 26px;
    }

    .highlight {
      color: #24364b;
      font-weight: 700;
    }

    .whatsapp-btn {
      display: block;
      width: 100%;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
      padding: 18px 22px;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(37, 211, 102, .22);
      transition: transform .2s ease, opacity .2s ease;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      opacity: .95;
    }

    .small {
      margin-top: 16px;
      margin-bottom: 0;
      font-size: 13px;
      color: #8a96a3;
    }

    @media (max-width: 520px) {
      .card {
        padding: 38px 22px;
      }

      .brand-name {
        font-size: 34px;
      }

      h1 {
        font-size: 28px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="shape one"></div>
    <div class="shape two"></div>
<h1>Como podemos cuidar de você hoje?</h1>

    <p>
      Fale com a equipe da DomVida para tirar dúvidas,
      solicitar informações e receber atendimento.
      <span class="highlight">Estamos prontos para ajudar.</span>
    </p>

    <a class="whatsapp-btn"
       href="https://wa.me/559199056865?text=Oi%21%20Vim%20pelo%20an%C3%BAncio%20e%20gostaria%20de%20ser%20atendido."
       target="_blank"
       rel="noopener noreferrer"
       onclick="fbq('track', 'Contact');">
      Clique aqui e entre em contato pelo WhatsApp
    </a>

    <p class="small">Atendimento rápido e direto com a equipe DomVida.</p>
  </main>
</body>
</html>
